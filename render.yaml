services:
  - type: web
    name: novus-homme-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: novus-homme-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@novushomme.uz
      - key: SEED_ADMIN_PASSWORD
        sync: false

databases:
  - name: novus-homme-db
    plan: free
